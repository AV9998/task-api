groups:
  - name: task-api
    rules:
      - alert: TaskApiDown
        expr: up{job="task-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Production task API is unavailable"
      - alert: TaskApiErrors
        expr: sum(increase(task_http_requests_total{code=~"5.."}[5m])) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Production task API returned more than five 5xx responses in five minutes"
